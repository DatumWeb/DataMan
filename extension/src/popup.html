<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DataMan</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <h1 class="title">DataMan</h1>

      <section class="section">
        <h2 class="section-title">Character selection</h2>
        <div id="character-grid" class="character-grid" aria-label="Character selection"></div>
      </section>

      <section class="section">
        <h2 id="stats-title" class="section-title">Character's stats</h2>
        <div id="stats-quick" class="quick-stats" aria-live="polite"></div>
      </section>

      <section class="section">
        <div id="action-buttons" class="actions"></div>
        <p id="view-status" class="muted" aria-live="polite"></p>
        <div id="data-view" class="events-panel" aria-live="polite"></div>
      </section>
    </main>
    <script src="popup/popupMain.js"></script>
  </body>
</html>
