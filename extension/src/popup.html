<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DataMan</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>DataMan</h1>
      <p class="muted">
        Storage + messaging smoke test. The <strong>avatar is not here</strong> — it draws on
        <strong>normal website tabs</strong> (top center, green “DM”). Open e.g.
        <span class="nowrap">example.com</span> after reloading the extension.
      </p>
      <button id="ping" type="button">Ping background</button>
      <p id="ping-result" class="muted" aria-live="polite"></p>

      <button id="summary" type="button">Load state summary</button>
      <pre id="summary-out" class="mono muted" aria-live="polite"></pre>

      <div class="row">
        <button id="sample-passive" type="button">Sample passive event</button>
        <button id="sample-active" type="button">Sample active extract</button>
      </div>
      <p id="sample-result" class="muted" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
