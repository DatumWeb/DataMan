<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DataMan</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <h1 class="title">DataMan</h1>

      <section class="section">
        <h2 class="section-title">Character selection</h2>
        <div id="character-grid" class="character-grid" aria-label="Character selection"></div>
      </section>

      <section class="section">
        <h2 id="stats-title" class="section-title">Character's stats</h2>
        <div id="stats-quick" class="quick-stats" aria-live="polite">
          <div class="stat-box">
            <span class="label">Total jumps</span>
            <span id="stat-jumps" class="value">0</span>
          </div>
          <div class="stat-box">
            <span class="label">Pixels</span>
            <span id="stat-pixels" class="value">0</span>
          </div>
          <div class="stat-box">
            <span class="label">Domains visited</span>
            <span id="stat-domains" class="value">0</span>
          </div>
          <div class="stat-box">
            <span class="label">Total extractions</span>
            <span id="stat-extractions" class="value">0</span>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="actions">
          <button id="view-all-events" type="button">View all tracked event data</button>
          <button id="view-extracted" type="button">View extracted data (clear)</button>
        </div>
        <p id="view-status" class="muted" aria-live="polite"></p>
        <div id="data-view" class="events-panel" aria-live="polite"></div>
      </section>
    </main>
    <script src="popup/popupMain.js"></script>
  </body>
</html>
